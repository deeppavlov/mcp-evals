name: CI

on:
  pull_request:

env:
  UV_PYTHON_BIN_DIR: /home/runner/uv-python-dir


jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Generate cache key
        id: cache-key
        run: echo "key=venv-${{ runner.os }}-${{ hashFiles('uv.lock') }}" >> $GITHUB_OUTPUT

      - name: Cache venv and Python
        id: cache-venv
        uses: actions/cache@v5
        with:
          path: |
            .venv
            ${{ env.UV_PYTHON_BIN_DIR }}
          key: ${{ steps.cache-key.outputs.key }}

      - name: Install uv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v7


      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv sync --all-groups --all-extras

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.14.4" # same as in pyproject.toml

  type-check:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Restore venv and Python cache
        uses: actions/cache@v5
        with:
          path: |
            .venv
            ${{ env.UV_PYTHON_BIN_DIR }}
          key: venv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          fail-on-cache-miss: true

      - name: Mypy
        run: .venv/bin/mypy .

  test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Restore venv and Python cache
        uses: actions/cache@v5
        with:
          path: |
            .venv
            ${{ env.UV_PYTHON_BIN_DIR }}
          key: venv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          fail-on-cache-miss: true

      - name: Run Tests
        run: .venv/bin/pytest
